[package]
name = "queri"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A native PostgreSQL and SQLite workspace"

[features]
test-support = ["gpui-kit/test-support"]

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.11"
chrono = "0.4"
directories = "6"
futures = "0.3"
fallible-iterator = "0.3"
getrandom = "0.4"
gpui-kit = { version = "=0.8.1", features = ["tree-sitter-sql"] }
lsp-types = "0.97"
native-tls = "0.2"
postgres-native-tls = "0.5"
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
sqlformat = "0.5.0"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[[test]]
name = "dialog_backdrop"
harness = false
required-features = ["test-support"]

[patch.crates-io]
tokio-postgres = { path = "vendor/tokio-postgres-0.7.18" }
gpui-pre = { path = "vendor/gpui-pre-0.3.10" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu-0.3.10" }
gpui-component = { path = "vendor/gpui-component-0.8.1" }

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
